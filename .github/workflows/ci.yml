name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Keep only the newest run for each pull request; protected main runs are never
# cancelled by a later push or by activity on another ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2 (resolved from the official repository).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Test release authorization gate
        run: bash .github/scripts/test-release-gate.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv-1.88.0

      - name: Check minimum supported Rust version
        run: cargo check --workspace --all-targets --locked

  test:
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux command sandbox
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor-profiles apparmor-utils bubblewrap keyutils
          bwrap --help | grep --quiet -- '--bind-fd FD DEST'
          if [[ -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict ]]; then
            sudo install -m 0644 \
              /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
              /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Validate public parity report
        if: matrix.os == 'ubuntu-latest'
        run: python3 .github/scripts/parity-report.py --format json

      - name: Test
        # macOS exposes its default temporary directory through /var, which is
        # a symlink to /private/var. Security tests intentionally reject database
        # paths that traverse symlinks, so use the runner's canonical temp root.
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          # Broker supervisor, service, and CLI fixtures retain independent
          # Tokio runtimes or exercise process-global POSIX locking. Keep each
          # fixture's internal concurrency, but do not overlap separate
          # fixtures in those packages. Other packages retain normal
          # scheduling, including paused-time tests that rely on Tokio's
          # automatic clock advancement.
          cargo test --workspace --exclude vyane-broker --exclude vyane-cli --exclude vyane-service
          # The no-lane maintenance case owns a paused Tokio runtime around
          # SQLite-backed maintenance. On macOS it can stall when that runtime
          # is created after the other supervisor contract runtimes have torn
          # down, even though it is stable in a fresh process.
          cargo test -p vyane-broker -- \
            --test-threads=1 \
            --skip maintenance_runs_without_delivery_lanes \
            --skip panics_use_bounded_exponential_backoff
          cargo test -p vyane-broker --test supervisor_contract \
            maintenance_runs_without_delivery_lanes \
            -- --exact
          # Paused-time panic backoff can stall after earlier supervisor
          # contract runtimes under suite load even though the body is stable
          # alone on start_paused Tokio time.
          cargo test -p vyane-broker --test supervisor_contract \
            panics_use_bounded_exponential_backoff \
            -- --exact
          # Resident service lifecycle fixtures can occasionally stall at the
          # handoff from earlier Tokio runtimes even though each is stable in a
          # fresh process. Keep the rest of the service suite serialized and
          # give each observed lifecycle case its own runtime/process boundary.
          cargo test -p vyane-service -- \
            --test-threads=1 \
            --skip agent_supervisor::tests::resident_supervisor_publishes_committed_completion \
            --skip message::tests::resident_broker_assembly_owns_scope_and_drains_without_delivery_lanes
          cargo test -p vyane-service \
            agent_supervisor::tests::resident_supervisor_publishes_committed_completion \
            -- --exact
          cargo test -p vyane-service \
            message::tests::resident_broker_assembly_owns_scope_and_drains_without_delivery_lanes \
            -- --exact
          # These adjacent unit tests both exercise the opaque dispatch cleanup
          # path. On macOS their per-test Tokio runtimes can occasionally stall
          # at the handoff between tests even though each body has completed.
          # Run each in its own process, then run every remaining CLI target.
          # The long dual-path workflow fixture drives blocking CLI polling
          # against Wiremock after earlier daemon fixtures. Run it last in a
          # fresh process so mock/runtime handoff cannot leave the workflow
          # stuck in `running` for the full 120s budget.
          cargo test -p vyane-cli -- \
            --test-threads=1 \
            --skip api::tests::completed_dispatch_keeps_runtime_control_until_exact_settlement_retry_succeeds \
            --skip api::tests::dispatch_panic_is_classified_internal_and_cleans_live_token \
            --skip submitted_workflow_outlives_cli_and_explicit_id_retry_is_idempotent \
            --skip process_agent_success_is_idempotent_and_publishes_exact_output \
            --skip mixed_process_and_native_lanes_run_concurrently_in_one_daemon \
            --skip native_writable_command_root_reaches_the_real_resident_sandbox \
            --skip native_command_permission_reaches_the_real_resident_sandbox \
            --skip native_agent_submit_uses_the_shared_resident_lane \
            --skip restart_settles_expired_native_controller_without_replaying_private_input \
            --skip restart_recovers_exact_controller_without_replay \
            --skip enabling_auto_pursuit_requires_stopping_a_plain_existing_daemon_first \
            --skip graceful_stop_cancels_active_native_wire_and_restart_settles_without_replay \
            --skip native_write_permission_reaches_the_real_resident_tool_lane \
            --skip native_web_search_uses_the_separate_frozen_responses_target \
            --skip native_agent_submit_fails_over_and_exact_retry_rejects_chain_drift \
            --skip native_agent_cancel_uses_the_exact_in_process_controller \
            --skip configured_tool_ask_stops_the_resident_lane_before_the_write_or_replay \
            --skip read_only_explicit_workdir_is_the_fake_harness_cwd \
            --skip configured_native_ceiling_rejects_an_optional_axis_before_the_model \
            --skip exit_zero_without_terminal_result_fails_without_completion \
            --skip cancel_stops_the_exact_process_group_and_settles_cancelled \
            --skip restart_cleans_terminal_controller_left_after_database_commit \
            --skip mcp_workflow_tools_use_the_authenticated_resident_daemon \
            --skip terminal_polling_never_crosses_total_budget \
            --skip submission_retries_an_ambiguous_timeout_within_one_total_budget \
            --skip resident_native_run_fails_over_before_tool_activity \
            --skip resident_native_run_rejects_frozen_chain_drift_before_wire \
            --skip resident_native_run_never_fails_over_after_tool_activity
          cargo test -p vyane-cli --bin vyane \
            api::tests::completed_dispatch_keeps_runtime_control_until_exact_settlement_retry_succeeds \
            -- --exact
          cargo test -p vyane-cli --bin vyane \
            api::tests::dispatch_panic_is_classified_internal_and_cleans_live_token \
            -- --exact
          # Concurrent process+native lane and process-lane success fixtures can
          # miss the first HTTP accept after earlier multi-thread daemon work
          # even though each body is stable alone. Run them alone before the
          # long dual-path workflow isolation.
          cargo test -p vyane-cli --test daemon_agent_acceptance \
            mixed_process_and_native_lanes_run_concurrently_in_one_daemon \
            -- --exact
          cargo test -p vyane-cli --test daemon_agent_acceptance \
            process_agent_success_is_idempotent_and_publishes_exact_output \
            -- --exact
          cargo test -p vyane-cli --test daemon_agent_acceptance \
            native_writable_command_root_reaches_the_real_resident_sandbox \
            -- --exact
          cargo test -p vyane-cli --test daemon_agent_acceptance \
            native_command_permission_reaches_the_real_resident_sandbox \
            -- --exact
          # Shared-resident native submit can lose output HTTP after earlier
          # multi-thread daemon fixtures even though the body is stable alone.
          cargo test -p vyane-cli --test daemon_agent_acceptance \
            native_agent_submit_uses_the_shared_resident_lane \
            -- --exact
          cargo test -p vyane-cli --test daemon_agent_acceptance \
            native_write_permission_reaches_the_real_resident_tool_lane \
            -- --exact
          cargo test -p vyane-cli --test daemon_agent_acceptance \
            native_web_search_uses_the_separate_frozen_responses_target \
            -- --exact
          cargo test -p vyane-cli --test daemon_agent_acceptance \
            native_agent_submit_fails_over_and_exact_retry_rejects_chain_drift \
            -- --exact
          cargo test -p vyane-cli --test daemon_agent_acceptance \
            native_agent_cancel_uses_the_exact_in_process_controller \
            -- --exact
          # Configured tool-ask stop uses the same multi-thread native AgentRun
          # wiremock + terminal-poll class as the write-permission isolation.
          cargo test -p vyane-cli --test daemon_agent_acceptance \
            configured_tool_ask_stops_the_resident_lane_before_the_write_or_replay \
            -- --exact
          # Process-harness read-only workdir can miss terminal settlement under
          # instrumented suite load even though the body is stable alone.
          cargo test -p vyane-cli --test daemon_agent_acceptance \
            read_only_explicit_workdir_is_the_fake_harness_cwd \
            -- --exact
          # Configured native ceiling reject is a multi-thread native AgentRun
          # control-plane fixture sharing suite-handoff sensitivity with neighbors.
          cargo test -p vyane-cli --test daemon_agent_acceptance \
            configured_native_ceiling_rejects_an_optional_axis_before_the_model \
            -- --exact
          # Process-harness exit-zero-without-result can miss terminal settlement
          # under suite load with only the daemon listen line.
          cargo test -p vyane-cli --test daemon_agent_acceptance \
            exit_zero_without_terminal_result_fails_without_completion \
            -- --exact
          # Process-group cancel settlement shares process-lane suite-handoff
          # sensitivity with neighboring process AgentRun fixtures.
          cargo test -p vyane-cli --test daemon_agent_acceptance \
            cancel_stops_the_exact_process_group_and_settles_cancelled \
            -- --exact
          # Terminal-controller residue cleanup after DB commit is the remaining
          # process-lane restart-class fixture still sharing the suite.
          cargo test -p vyane-cli --test daemon_agent_acceptance \
            restart_cleans_terminal_controller_left_after_database_commit \
            -- --exact
          # MCP workflow tools drive a multi-thread resident-daemon + Wiremock
          # fixture class already partially isolated for long dual-path workflow.
          cargo test -p vyane-cli --test daemon_workflow_acceptance \
            mcp_workflow_tools_use_the_authenticated_resident_daemon \
            -- --exact
          # Terminal polling budget fixture is multi_thread Wiremock client-side
          # and stays schedulable alone after suite handoffs.
          cargo test -p vyane-cli --test daemon_agent_acceptance \
            terminal_polling_never_crosses_total_budget \
            -- --exact
          # Submission retry budget fixture is multi_thread Wiremock client-side
          # and stays schedulable alone after suite handoffs.
          cargo test -p vyane-cli --test daemon_agent_acceptance \
            submission_retries_an_ambiguous_timeout_within_one_total_budget \
            -- --exact
          # Multi-mock resident native unit failover shares suite-handoff
          # sensitivity with multi_thread native AgentRun isolations.
          cargo test -p vyane-cli --bin vyane \
            native_agent::tests::resident_native_run_fails_over_before_tool_activity \
            -- --exact
          cargo test -p vyane-cli --bin vyane \
            native_agent::tests::resident_native_run_rejects_frozen_chain_drift_before_wire \
            -- --exact
          cargo test -p vyane-cli --bin vyane \
            native_agent::tests::resident_native_run_never_fails_over_after_tool_activity \
            -- --exact
          # Expired-controller restart settlement can still observe `running`
          # under suite load after earlier daemon fixtures; the body is stable
          # alone on the intentional current-thread runtime.
          cargo test -p vyane-cli --test daemon_agent_acceptance \
            restart_settles_expired_native_controller_without_replaying_private_input \
            -- --exact
          # Exact-controller restart recovery was already isolated under
          # coverage; PR #82 showed the same suite-load deadline miss on the
          # normal job once neighboring restart fixtures were skipped out.
          cargo test -p vyane-cli --test daemon_agent_acceptance \
            restart_recovers_exact_controller_without_replay \
            -- --exact
          # Long-delay graceful stop + restart settlement is the remaining
          # restart-class fixture still sharing the serialized suite with
          # neighbors that already needed process isolation.
          cargo test -p vyane-cli --test daemon_agent_acceptance \
            graceful_stop_cancels_active_native_wire_and_restart_settles_without_replay \
            -- --exact
          # Plain-to-auto-pursuit daemon start can fail stop under suite load on
          # macOS even though the body is stable alone.
          cargo test -p vyane-cli --test daemon_goal_acceptance \
            enabling_auto_pursuit_requires_stopping_a_plain_existing_daemon_first \
            -- --exact
          cargo test -p vyane-cli --test daemon_workflow_acceptance \
            submitted_workflow_outlives_cli_and_explicit_id_retry_is_idempotent \
            -- --exact

  coverage:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux command sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor-profiles apparmor-utils bubblewrap keyutils
          bwrap --help | grep --quiet -- '--bind-fd FD DEST'
          if [[ -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict ]]; then
            sudo install -m 0644 \
              /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
              /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi

      # taiki-e/install-action v2.83.1 (resolved from the official repository).
      - uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145
        with:
          tool: cargo-llvm-cov

      # Measurement only for now: report the summary, no threshold gate.
      - name: Coverage summary
        run: |
          cargo llvm-cov clean --workspace
          # Broker supervisor fixtures retain Tokio runtimes whose paused-time
          # progress can starve when separate test cases overlap under
          # instrumentation. Measure every broker test, but serialize that
          # package just like the existing CLI coverage batch. Preserve the
          # service lifecycle process boundary from the main test job too.
          cargo llvm-cov --no-report --workspace \
            --exclude vyane-broker \
            --exclude vyane-cli \
            --exclude vyane-service
          cargo llvm-cov --no-report -p vyane-broker -- \
            --test-threads=1 \
            --skip maintenance_runs_without_delivery_lanes \
            --skip panics_use_bounded_exponential_backoff
          cargo llvm-cov --no-report -p vyane-broker --test supervisor_contract -- \
            maintenance_runs_without_delivery_lanes \
            --exact
          cargo llvm-cov --no-report -p vyane-broker --test supervisor_contract -- \
            panics_use_bounded_exponential_backoff \
            --exact
          cargo llvm-cov --no-report -p vyane-service -- \
            --test-threads=1 \
            --skip agent_supervisor::tests::resident_supervisor_publishes_committed_completion \
            --skip message::tests::resident_broker_assembly_owns_scope_and_drains_without_delivery_lanes
          cargo llvm-cov --no-report -p vyane-service -- \
            agent_supervisor::tests::resident_supervisor_publishes_committed_completion \
            --exact
          cargo llvm-cov --no-report -p vyane-service -- \
            message::tests::resident_broker_assembly_owns_scope_and_drains_without_delivery_lanes \
            --exact
          # The process-restart acceptance case launches and observes a
          # detached daemon. Under instrumentation, running it after the other
          # daemon fixtures can delay the first worker invocation beyond its
          # own explicit startup guard. Preserve that guard and measure the
          # case in a fresh test process.
          cargo llvm-cov --no-report -p vyane-cli -- \
            --test-threads=1 \
            --skip restart_recovers_exact_controller_without_replay \
            --skip submitted_workflow_outlives_cli_and_explicit_id_retry_is_idempotent \
            --skip process_agent_success_is_idempotent_and_publishes_exact_output \
            --skip mixed_process_and_native_lanes_run_concurrently_in_one_daemon \
            --skip native_writable_command_root_reaches_the_real_resident_sandbox \
            --skip native_command_permission_reaches_the_real_resident_sandbox \
            --skip native_agent_submit_uses_the_shared_resident_lane \
            --skip restart_settles_expired_native_controller_without_replaying_private_input \
            --skip enabling_auto_pursuit_requires_stopping_a_plain_existing_daemon_first \
            --skip graceful_stop_cancels_active_native_wire_and_restart_settles_without_replay \
            --skip native_write_permission_reaches_the_real_resident_tool_lane \
            --skip native_web_search_uses_the_separate_frozen_responses_target \
            --skip native_agent_submit_fails_over_and_exact_retry_rejects_chain_drift \
            --skip native_agent_cancel_uses_the_exact_in_process_controller \
            --skip configured_tool_ask_stops_the_resident_lane_before_the_write_or_replay \
            --skip read_only_explicit_workdir_is_the_fake_harness_cwd \
            --skip configured_native_ceiling_rejects_an_optional_axis_before_the_model \
            --skip exit_zero_without_terminal_result_fails_without_completion \
            --skip cancel_stops_the_exact_process_group_and_settles_cancelled \
            --skip restart_cleans_terminal_controller_left_after_database_commit \
            --skip mcp_workflow_tools_use_the_authenticated_resident_daemon \
            --skip terminal_polling_never_crosses_total_budget \
            --skip submission_retries_an_ambiguous_timeout_within_one_total_budget \
            --skip resident_native_run_fails_over_before_tool_activity \
            --skip resident_native_run_rejects_frozen_chain_drift_before_wire \
            --skip resident_native_run_never_fails_over_after_tool_activity
          cargo llvm-cov --no-report -p vyane-cli --test daemon_agent_acceptance \
            -- restart_recovers_exact_controller_without_replay \
            --exact
          cargo llvm-cov --no-report -p vyane-cli --test daemon_agent_acceptance \
            -- mixed_process_and_native_lanes_run_concurrently_in_one_daemon \
            --exact
          cargo llvm-cov --no-report -p vyane-cli --test daemon_agent_acceptance \
            -- process_agent_success_is_idempotent_and_publishes_exact_output \
            --exact
          cargo llvm-cov --no-report -p vyane-cli --test daemon_agent_acceptance \
            -- native_writable_command_root_reaches_the_real_resident_sandbox \
            --exact
          cargo llvm-cov --no-report -p vyane-cli --test daemon_agent_acceptance \
            -- native_command_permission_reaches_the_real_resident_sandbox \
            --exact
          cargo llvm-cov --no-report -p vyane-cli --test daemon_agent_acceptance \
            -- native_agent_submit_uses_the_shared_resident_lane \
            --exact
          cargo llvm-cov --no-report -p vyane-cli --test daemon_agent_acceptance \
            -- native_write_permission_reaches_the_real_resident_tool_lane \
            --exact
          cargo llvm-cov --no-report -p vyane-cli --test daemon_agent_acceptance \
            -- native_web_search_uses_the_separate_frozen_responses_target \
            --exact
          cargo llvm-cov --no-report -p vyane-cli --test daemon_agent_acceptance \
            -- native_agent_submit_fails_over_and_exact_retry_rejects_chain_drift \
            --exact
          cargo llvm-cov --no-report -p vyane-cli --test daemon_agent_acceptance \
            -- native_agent_cancel_uses_the_exact_in_process_controller \
            --exact
          cargo llvm-cov --no-report -p vyane-cli --test daemon_agent_acceptance \
            -- configured_tool_ask_stops_the_resident_lane_before_the_write_or_replay \
            --exact
          cargo llvm-cov --no-report -p vyane-cli --test daemon_agent_acceptance \
            -- read_only_explicit_workdir_is_the_fake_harness_cwd \
            --exact
          cargo llvm-cov --no-report -p vyane-cli --test daemon_agent_acceptance \
            -- configured_native_ceiling_rejects_an_optional_axis_before_the_model \
            --exact
          cargo llvm-cov --no-report -p vyane-cli --test daemon_agent_acceptance \
            -- exit_zero_without_terminal_result_fails_without_completion \
            --exact
          cargo llvm-cov --no-report -p vyane-cli --test daemon_agent_acceptance \
            -- cancel_stops_the_exact_process_group_and_settles_cancelled \
            --exact
          cargo llvm-cov --no-report -p vyane-cli --test daemon_agent_acceptance \
            -- restart_cleans_terminal_controller_left_after_database_commit \
            --exact
          cargo llvm-cov --no-report -p vyane-cli --test daemon_workflow_acceptance \
            -- mcp_workflow_tools_use_the_authenticated_resident_daemon \
            --exact
          cargo llvm-cov --no-report -p vyane-cli --test daemon_agent_acceptance \
            -- terminal_polling_never_crosses_total_budget \
            --exact
          cargo llvm-cov --no-report -p vyane-cli --test daemon_agent_acceptance \
            -- submission_retries_an_ambiguous_timeout_within_one_total_budget \
            --exact
          cargo llvm-cov --no-report -p vyane-cli --bin vyane -- \
            native_agent::tests::resident_native_run_fails_over_before_tool_activity \
            --exact
          cargo llvm-cov --no-report -p vyane-cli --bin vyane -- \
            native_agent::tests::resident_native_run_rejects_frozen_chain_drift_before_wire \
            --exact
          cargo llvm-cov --no-report -p vyane-cli --bin vyane -- \
            native_agent::tests::resident_native_run_never_fails_over_after_tool_activity \
            --exact
          cargo llvm-cov --no-report -p vyane-cli --test daemon_agent_acceptance \
            -- restart_settles_expired_native_controller_without_replaying_private_input \
            --exact
          cargo llvm-cov --no-report -p vyane-cli --test daemon_agent_acceptance \
            -- graceful_stop_cancels_active_native_wire_and_restart_settles_without_replay \
            --exact
          cargo llvm-cov --no-report -p vyane-cli --test daemon_goal_acceptance \
            -- enabling_auto_pursuit_requires_stopping_a_plain_existing_daemon_first \
            --exact
          # Drop incremental debris after the full instrumented suite so the
          # long dual-path workflow fixture is not disk- or fd-starved while
          # Wiremock holds an in-flight delayed target for the resident daemon.
          rm -rf target/llvm-cov-target/debug/incremental
          cargo llvm-cov --no-report -p vyane-cli --test daemon_workflow_acceptance \
            -- submitted_workflow_outlives_cli_and_explicit_id_retry_is_idempotent \
            --exact
          cargo llvm-cov report --summary-only
