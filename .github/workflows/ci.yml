name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Keep only the newest run for each pull request; protected main runs are never
# cancelled by a later push or by activity on another ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2 (resolved from the official repository).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Test release authorization gate
        run: bash .github/scripts/test-release-gate.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv-1.88.0

      - name: Check minimum supported Rust version
        run: cargo check --workspace --all-targets --locked

  test:
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux command sandbox
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor-profiles apparmor-utils bubblewrap keyutils
          bwrap --help | grep --quiet -- '--bind-fd FD DEST'
          if [[ -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict ]]; then
            sudo install -m 0644 \
              /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
              /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Validate public parity report
        if: matrix.os == 'ubuntu-latest'
        run: python3 .github/scripts/parity-report.py --format json

      - name: Test
        # macOS exposes its default temporary directory through /var, which is
        # a symlink to /private/var. Security tests intentionally reject database
        # paths that traverse symlinks, so use the runner's canonical temp root.
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          # Broker supervisor, service, and CLI fixtures retain independent
          # Tokio runtimes or exercise process-global POSIX locking. Keep each
          # fixture's internal concurrency, but do not overlap separate
          # fixtures in those packages. Other packages retain normal
          # scheduling, including paused-time tests that rely on Tokio's
          # automatic clock advancement.
          cargo test --workspace --exclude vyane-broker --exclude vyane-cli --exclude vyane-service
          # The no-lane maintenance case owns a paused Tokio runtime around
          # SQLite-backed maintenance. On macOS it can stall when that runtime
          # is created after the other supervisor contract runtimes have torn
          # down, even though it is stable in a fresh process.
          cargo test -p vyane-broker -- \
            --test-threads=1 \
            --skip maintenance_runs_without_delivery_lanes
          cargo test -p vyane-broker --test supervisor_contract \
            maintenance_runs_without_delivery_lanes \
            -- --exact
          # Resident service lifecycle fixtures can occasionally stall at the
          # handoff from earlier Tokio runtimes even though each is stable in a
          # fresh process. Keep the rest of the service suite serialized and
          # give each observed lifecycle case its own runtime/process boundary.
          cargo test -p vyane-service -- \
            --test-threads=1 \
            --skip agent_supervisor::tests::resident_supervisor_publishes_committed_completion \
            --skip message::tests::resident_broker_assembly_owns_scope_and_drains_without_delivery_lanes
          cargo test -p vyane-service \
            agent_supervisor::tests::resident_supervisor_publishes_committed_completion \
            -- --exact
          cargo test -p vyane-service \
            message::tests::resident_broker_assembly_owns_scope_and_drains_without_delivery_lanes \
            -- --exact
          # These adjacent unit tests both exercise the opaque dispatch cleanup
          # path. On macOS their per-test Tokio runtimes can occasionally stall
          # at the handoff between tests even though each body has completed.
          # Run each in its own process, then run every remaining CLI target.
          cargo test -p vyane-cli -- \
            --test-threads=1 \
            --skip api::tests::completed_dispatch_keeps_runtime_control_until_exact_settlement_retry_succeeds \
            --skip api::tests::dispatch_panic_is_classified_internal_and_cleans_live_token
          cargo test -p vyane-cli --bin vyane \
            api::tests::completed_dispatch_keeps_runtime_control_until_exact_settlement_retry_succeeds \
            -- --exact
          cargo test -p vyane-cli --bin vyane \
            api::tests::dispatch_panic_is_classified_internal_and_cleans_live_token \
            -- --exact

  coverage:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux command sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor-profiles apparmor-utils bubblewrap keyutils
          bwrap --help | grep --quiet -- '--bind-fd FD DEST'
          if [[ -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict ]]; then
            sudo install -m 0644 \
              /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
              /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi

      # taiki-e/install-action v2.83.1 (resolved from the official repository).
      - uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145
        with:
          tool: cargo-llvm-cov

      # Measurement only for now: report the summary, no threshold gate.
      - name: Coverage summary
        run: |
          cargo llvm-cov clean --workspace
          # Broker supervisor fixtures retain Tokio runtimes whose paused-time
          # progress can starve when separate test cases overlap under
          # instrumentation. Measure every broker test, but serialize that
          # package just like the existing CLI coverage batch. Preserve the
          # service lifecycle process boundary from the main test job too.
          cargo llvm-cov --no-report --workspace \
            --exclude vyane-broker \
            --exclude vyane-cli \
            --exclude vyane-service
          cargo llvm-cov --no-report -p vyane-broker -- --test-threads=1
          cargo llvm-cov --no-report -p vyane-service -- \
            --test-threads=1 \
            --skip agent_supervisor::tests::resident_supervisor_publishes_committed_completion \
            --skip message::tests::resident_broker_assembly_owns_scope_and_drains_without_delivery_lanes
          cargo llvm-cov --no-report -p vyane-service -- \
            agent_supervisor::tests::resident_supervisor_publishes_committed_completion \
            --exact
          cargo llvm-cov --no-report -p vyane-service -- \
            message::tests::resident_broker_assembly_owns_scope_and_drains_without_delivery_lanes \
            --exact
          # The process-restart acceptance case launches and observes a
          # detached daemon. Under instrumentation, running it after the other
          # daemon fixtures can delay the first worker invocation beyond its
          # own explicit startup guard. Preserve that guard and measure the
          # case in a fresh test process.
          cargo llvm-cov --no-report -p vyane-cli -- \
            --test-threads=1 \
            --skip restart_recovers_exact_controller_without_replay
          cargo llvm-cov --no-report -p vyane-cli --test daemon_agent_acceptance \
            -- restart_recovers_exact_controller_without_replay \
            --exact
          cargo llvm-cov report --summary-only
